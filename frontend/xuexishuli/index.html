<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习内容梳理 · 数小伴</title>
<link rel="stylesheet" href="vendor/element-plus.css">
<style>
  :root{
    --bg:#F4FBF8;
    --primary:#62B89B;
    --primary-deep:#3E8F76;
    --primary-soft:#E8F6F1;
    --primary-line:#BFE5D8;
    --ink:#333333;
    --muted:#8A9A95;
    --line:#EAF2EF;
    --radius:16px;
    --shadow:0 4px 12px rgba(0,0,0,.03);
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI","Segoe UI Emoji",sans-serif;
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ---------- 顶部导航（与页面一一致） ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:linear-gradient(90deg,#E6F8F1 0%,#F6FDFA 52%,#E4F7EF 100%);
    border-bottom:1px solid #C6EADF;
    box-shadow:0 2px 14px rgba(63,174,147,.09);
    backdrop-filter:blur(10px);
  }

  .topbar-inner{
    max-width:1440px;
    margin:0 auto;
    height:62px;
    padding:0 32px;
    display:flex;
    align-items:center;
    gap:34px;
  }

  .brand{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-logo{
    width:38px;
    height:38px;
    overflow:hidden;
    border-radius:11px;
    border:1px solid #BFE9DA;
    background:linear-gradient(135deg,#FFFFFF,#D8F5EA);
    display:grid;
    place-items:center;
    box-shadow:0 2px 8px rgba(63,174,147,.14);
  }

  .brand-logo img{display:block;width:100%;height:100%;object-fit:cover;}

  .brand-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:.5px;
  }

  .mainnav{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    min-width:0;
  }

  .nav-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 12px;
    border-radius:9px;
    font-size:13px;
    color:#708480;
    white-space:nowrap;
    transition:background .18s,color .18s;
  }

  .nav-link .ico{font-size:13px;opacity:.9;}

  .nav-link:hover{background:rgba(111,211,183,.18);color:var(--primary-deep);}

  .nav-link.is-active{
    color:#175F4C;
    font-weight:700;
    background:linear-gradient(135deg,#D5F3E8,#ECFAF4);
    box-shadow:inset 0 -2px 0 #3FAE93;
  }

  /* ---------- 左右布局 ---------- */
  .layout{
    max-width:1440px;
    margin:0 auto;
    padding:0 32px 44px;
    display:flex;
    align-items:flex-start;
  }

  .sidebar{
    flex:0 0 208px;
    width:208px;
    border-right:1px solid var(--line);
    padding:22px 24px 10px 0;
    position:sticky;
    top:78px;
    max-height:calc(100vh - 96px);
    overflow-y:auto;
    align-self:flex-start;
  }

  .side-brand{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 0 14px;
    border-bottom:1px solid var(--line);
    margin-bottom:12px;
  }

  .side-brand img{
    width:26px;
    height:26px;
    border-radius:8px;
    object-fit:cover;
    border:1px solid var(--primary-line);
  }

  .side-brand span{font-size:13px;font-weight:700;letter-spacing:.3px;}

  .side-menu{display:flex;flex-direction:column;gap:2px;}

  .side-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px 9px;
    border-radius:8px;
    font-size:12.5px;
    color:#4E6862;
    border:0;
    background:none;
    text-align:left;
    cursor:pointer;
    transition:background .18s,color .18s;
  }

  .side-item .ico{font-size:13px;}

  .side-item:hover{background:#F2FAF7;color:var(--primary-deep);}

  .side-item.is-active{
    background:var(--primary-soft);
    color:#1F6B55;
    font-weight:700;
    box-shadow:inset 2px 0 0 var(--primary);
  }

  /* ---------- 主内容区 ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:20px 0 0 32px;
  }

  .page-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
  }

  .page-title{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:.4px;
  }

  .page-sub{
    margin:5px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }

  .head-actions{display:flex;gap:10px;}

  .ghost-btn{
    --el-button-bg-color:transparent;
    --el-button-border-color:#8FD3BF;
    --el-button-text-color:var(--primary-deep);
    --el-button-hover-bg-color:var(--primary-soft);
    --el-button-hover-border-color:var(--primary);
    --el-button-hover-text-color:#2F7A63;
    --el-button-active-bg-color:#DFF3EC;
    --el-button-active-border-color:var(--primary);
    --el-button-active-text-color:#2F7A63;
    border-radius:10px;
    font-size:12.5px;
    padding:8px 16px;
  }

  .card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 22px;
    margin-bottom:18px;
  }

  /* ---------- 主题范围卡片 ---------- */
  .scope-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
  }

  .scope-label{
    margin:0 0 4px;
    font-size:12px;
    color:var(--muted);
  }

  .scope-value{
    margin:0;
    font-size:15.5px;
    font-weight:700;
  }

  .scope-value em{
    font-style:normal;
    color:var(--primary-deep);
  }

  .scope-tag{
    display:inline-block;
    margin-left:6px;
    padding:1px 8px;
    border-radius:6px;
    background:var(--primary-soft);
    color:var(--primary-deep);
    font-size:11.5px;
    font-weight:700;
    vertical-align:2px;
  }

  .scope-source{
    display:flex;
    align-items:flex-start;
    gap:8px;
    max-width:430px;
    padding:9px 12px;
    border-radius:10px;
    background:#F8FCFA;
    border:1px dashed #D9EDE5;
  }

  .scope-source .ico{font-size:14px;line-height:1.5;}

  .scope-source p{margin:0;font-size:11.5px;line-height:1.7;color:#71857F;}

  .scope-source b{color:#3F5B54;font-weight:600;}

  .scope-divider{
    height:1px;
    background:var(--line);
    margin:16px 0 13px;
  }

  .filter-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .filter-label{font-size:11.5px;color:var(--muted);margin-right:2px;}

  .chip{
    padding:5px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:#6B837C;
    font-size:12px;
    cursor:pointer;
    transition:all .18s;
  }

  .chip:hover{border-color:var(--primary-line);color:var(--primary-deep);}

  .chip.is-active{
    background:var(--primary-soft);
    border-color:var(--primary-line);
    color:#1F6B55;
    font-weight:700;
  }

  /* ---------- 表格卡片 ---------- */
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:14px;
  }

  .card-title{
    margin:0;
    font-size:14.5px;
    font-weight:800;
    letter-spacing:.2px;
  }

  .card-note{font-size:11.5px;color:var(--muted);}

  .table-card .el-table{
    --el-table-border-color:#F0F5F2;
    --el-table-header-bg-color:#F1F8F5;
    --el-table-row-hover-bg-color:#F3FBF8;
    --el-table-text-color:#3F5450;
    --el-table-header-text-color:#3E5C55;
    font-size:12.5px;
    border-radius:10px;
  }

  .table-card .el-table th.el-table__cell{
    font-weight:700;
    font-size:12px;
    padding:10px 0;
    background:#F1F8F5;
  }

  .table-card .el-table td.el-table__cell{padding:11px 0;}

  .table-card .el-table__body tr{cursor:pointer;}

  .table-card .el-table__body tr:hover>td.el-table__cell{background:#F3FBF8;}

  .table-card .el-table::before,
  .table-card .el-table__inner-wrapper::before{display:none;}

  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:11.5px;color:#4A6B62;}

  .topic-pill{
    display:inline-block;
    padding:1px 8px;
    border-radius:6px;
    background:#F2FAF7;
    color:#3E8F76;
    font-size:11px;
    font-weight:600;
  }

  /* ---------- 弹窗 ---------- */
  .detail-dialog .el-dialog,
  .el-dialog.detail-dialog{
    border-radius:16px;
    padding:0;
    overflow:hidden;
  }

  .detail-dialog .el-dialog__header,
  .el-dialog.detail-dialog .el-dialog__header{
    margin:0;
    padding:18px 22px 14px;
    border-bottom:1px solid var(--line);
  }

  .detail-dialog .el-dialog__title{font-size:15px;font-weight:800;color:var(--ink);}

  .detail-dialog .el-dialog__headerbtn{top:16px;right:16px;}

  .detail-dialog .el-dialog__body{padding:18px 22px 22px;}

  .block + .block{margin-top:18px;}

  .block-title{
    display:flex;
    align-items:center;
    gap:7px;
    margin:0 0 8px;
    font-size:12.5px;
    font-weight:700;
    color:#33534B;
  }

  .block-title i{
    width:3px;
    height:13px;
    border-radius:2px;
    background:var(--primary);
    display:inline-block;
  }

  .std-quote{
    margin:0;
    padding:12px 14px;
    border-left:3px solid var(--primary);
    border-radius:0 10px 10px 0;
    background:#F6FCFA;
    font-size:12.5px;
    line-height:1.85;
    color:#405B54;
  }

  .std-quote .meta{
    display:block;
    margin-top:6px;
    font-size:11px;
    color:#8FA39D;
  }

  .material-card{
    border:1px solid var(--primary-line);
    border-radius:12px;
    overflow:hidden;
    background:#fff;
  }

  .material-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    background:#F1F8F5;
    font-size:11.5px;
    color:#5C7A71;
  }

  .material-bar b{color:#2F6F5B;font-size:12px;}

  .material-body{padding:14px 16px;}

  .material-stem{
    margin:0;
    font-size:12.5px;
    line-height:1.9;
    color:#3D514D;
  }

  .material-figure{
    margin-top:12px;
    padding:18px;
    border-radius:10px;
    background:repeating-linear-gradient(45deg,#FAFEFC,#FAFEFC 8px,#F4FBF8 8px,#F4FBF8 16px);
    border:1px dashed #D5EBE3;
    text-align:center;
    font-size:11px;
    color:#9AAEA7;
  }

  .dialog-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--muted);
  }

  /* ---------- 依赖关系图 ---------- */
  .graph-box{width:100%;height:340px;}

  /* ---------- 思维导图 ---------- */
  .mindmap-card{padding:14px 14px 10px;}

  .mindmap .graph-box{height:620px;}

  .mindmap-toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:0 4px 10px;
  }

  .mm-btn{
    padding:5px 13px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:#4E6862;font-size:11.5px;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s;
  }

  .mm-btn:hover{background:var(--primary-soft);border-color:var(--primary-line);color:#1F6B55;}

  .mm-hint{font-size:11px;color:var(--muted);margin-left:auto;}

  .view-bar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin:0 0 12px;flex-wrap:wrap;
  }

  .view-tabs{
    display:inline-flex;padding:3px;border-radius:10px;
    background:#EAF6F1;border:1px solid #D8EDE5;
  }

  .view-tabs button{
    padding:6px 16px;border:0;border-radius:8px;background:transparent;
    font-size:12px;color:#5C7A71;cursor:pointer;transition:all .18s;
  }

  .view-tabs button.is-on{
    background:#fff;color:#1F6B55;font-weight:700;
    box-shadow:0 2px 6px rgba(79,169,142,.16);
  }

  .view-hint{font-size:11.5px;color:var(--muted);}

  .graph-legend{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:11px;
    color:var(--muted);
  }

  .graph-legend span{display:inline-flex;align-items:center;gap:5px;}

  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .dot--start{background:#A8E4D2;}
  .dot--core{background:#62B89B;}

  @media (max-width:1200px){
    .mainnav{overflow-x:auto;scrollbar-width:none;}
    .mainnav::-webkit-scrollbar{display:none;}
    .nav-link{padding:8px 9px;font-size:12.5px;}
    .topbar-inner{gap:18px;}
  }

  @media (max-width:1080px){
    .topbar-inner{padding:0 20px;gap:16px;}
    .main{padding:18px 0 0 24px;}
    .scope-top{flex-direction:column;gap:12px;}
    .scope-source{max-width:none;}
  }

  @media (max-width:960px){
    .layout{flex-direction:column;padding:0 20px 32px;gap:18px;}
    .sidebar{
      position:static;
      flex:0 0 auto;
      width:100%;
      max-height:none;
      padding:16px 0 8px;
      border-right:0;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px 16px;
      align-items:start;
    }
    .side-brand,.side-menu{grid-column:1/-1;}
    .main{padding:4px 0 0;}
  }

  /* ---------- 配套题目 ---------- */
  .q-list{display:flex;flex-direction:column;gap:10px;padding:4px 0;}
  .q-list--modal{max-height:56vh;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--primary-line) transparent;}
  .q-list--modal::-webkit-scrollbar{width:6px;}
  .q-list--modal::-webkit-scrollbar-thumb{background:var(--primary-line);border-radius:4px;}
  .q-item{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    background:#fff;
    transition:border-color .2s, box-shadow .2s;
  }
  .q-item:hover{border-color:var(--primary-line);box-shadow:0 2px 10px rgba(98,184,155,.08);}
  .q-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .q-qid{
    padding:1px 8px;border-radius:5px;
    background:#F1F8F5;color:#446A62;font-size:11px;font-weight:700;
  }
  .q-type{
    padding:1px 8px;border-radius:5px;font-size:10px;font-weight:700;
  }
  .q-type--填空题{background:#FFF7E6;color:#B87C16;}
  .q-type--选择题{background:#EAF3FF;color:#2D6FD0;}
  .q-type--解答题{background:#E9F7EF;color:#2F7A5C;}
  .q-score{font-size:10.5px;color:var(--muted);}
  .q-kpi{margin-left:auto;font-size:10.5px;color:var(--muted);}
  .q-mat{
    padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;
    background:#F5F0FF;color:#6B4AA8;margin-left:auto;
  }

  .q-stem{
    margin:0 0 4px;
    font-size:12.5px;
    line-height:1.8;
    color:#3D514D;
  }
  .q-options{margin:4px 0 4px;}
  .q-options-pre{
    margin:0;white-space:pre-wrap;font-family:inherit;
    padding:8px 12px;border-radius:8px;
    background:#F6FCFA;border:1px dashed #D5EBE3;
    font-size:12px;line-height:1.65;color:#4B615B;
  }
  .q-answer summary{
    cursor:pointer;font-size:11.5px;color:#5C7A71;font-weight:600;
    padding:3px 0;user-select:none;list-style:none;
  }
  .q-answer summary::-webkit-details-marker{display:none;}
  .q-answer summary::before{content:'▸';display:inline-block;margin-right:5px;font-size:10px;color:var(--primary);transition:transform .2s;}
  .q-answer[open] summary::before{transform:rotate(90deg);}
  .q-ans-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px;
  }
  .q-ans-col h4{
    margin:0 0 3px;font-size:11px;font-weight:700;color:var(--primary-deep);letter-spacing:.2px;
  }
  .q-ans-col p{
    margin:0;font-size:12px;line-height:1.7;color:#3D514D;
    padding:6px 10px;border-radius:6px;background:#F6FCFA;border:1px solid #E4F2EC;
    white-space:pre-wrap;
  }
  .q-rubric-wrap{margin-top:6px;}
  .q-rubric-wrap h4{margin:0 0 3px;font-size:11px;font-weight:700;color:var(--primary-deep);}
  .q-rubric{
    margin:0;white-space:pre-wrap;font-family:inherit;
    font-size:11.5px;line-height:1.7;color:#4B615B;
    padding:6px 10px;border-radius:6px;background:#FFFBEF;border:1px dashed #E6D7A8;
  }
  @media (max-width:780px){
    .q-ans-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="app">
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../shouye/index.html">
        <span class="brand-logo"><img src="../chuangtu/logo.jpg" alt="数小伴 Logo"></span>
        <span class="brand-name">数小伴</span>
      </a>
      <nav class="mainnav" aria-label="主导航">
        <a class="nav-link" href="../shouye/index.html"><span class="ico">🏠</span>首页</a>
        <a class="nav-link is-active" href="../xuexishuli/index.html"><span class="ico">📚</span>学习梳理</a>
        <a class="nav-link" href="../xueqingfenxi/index.html"><span class="ico">📈</span>学情分析</a>
        <a class="nav-link" href="../xuexijianyi/index.html"><span class="ico">💡</span>学习建议</a>
        <a class="nav-link" href="../anlihedui/index.html"><span class="ico">🧾</span>案例核对</a>
        <a class="nav-link" href="#"><span class="ico">⚙️</span>设置</a>
      </nav>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="side-brand">
        <img src="../chuangtu/logo.jpg" alt="">
        <span>数小伴</span>
      </div>
      <nav class="side-menu">
        <button
          v-for="item in menus"
          :key="item.key"
          class="side-item"
          :class="{ 'is-active': item.key === 'content' }"
          type="button"
          @click="handleMenu(item)">
          <span class="ico">{{ item.icon }}</span>{{ item.label }}
        </button>
      </nav>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <div class="page-head">
        <div>
          <h1 class="page-title">学习内容梳理</h1>
          <p class="page-sub">构建结构化学习要求清单</p>
        </div>
        <div class="head-actions">
          <el-button class="ghost-btn" @click="exportJson">导出 JSON</el-button>
          <el-button class="ghost-btn" @click="exportCsv">导出 CSV</el-button>
        </div>
      </div>

      <!-- 主题范围 -->
      <scope-card
        :topics="topics"
        v-model="activeTopic"
        :count="filteredRows.length"
        :total="rows.length"></scope-card>

      <div class="view-bar">
        <div class="view-tabs">
          <button type="button" :class="{ 'is-on': viewMode === 'map' }" @click="viewMode = 'map'">思维导图</button>
          <button type="button" :class="{ 'is-on': viewMode === 'list' }" @click="viewMode = 'list'">清单视图</button>
        </div>
        <span class="view-hint">{{ viewMode === 'map' ? '导图展示前置知识点依赖，点击节点逐层展开' : '点击任意一行查看课标原文与材料溯源' }}</span>
      </div>

      <!-- 思维导图 -->
      <section class="card mindmap-card" v-show="viewMode === 'map'">
        <dependency-graph :rows="filteredRows" @node-detail="openDetail"></dependency-graph>
      </section>

      <!-- 结构化表格 -->
      <section class="card table-card" v-show="viewMode === 'list'">
        <div class="card-head">
          <h2 class="card-title">结构化学习要求清单</h2>

        var lines = [headers.join(',')];

  function download(filename, content, mime){
    var blob = new Blob([content], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

          kind: 'point',
          row: r,
          itemStyle: { color: '#F1FAF6', borderWidth: 1, borderColor: '#BFE5D8' },
          label: { color: '#2F6F5B', fontSize: 11, fontWeight: 600 },

              name: '📄 教材材料 · ' + (r.materials || '—'),

              label: { color: '#A87A2E', fontSize: 10.5, fontWeight: 600 }
            }
          ]
        });
      });
      root.children.push(tNode);
    });

      animationDuration: 600,

      tooltip: {
        backgroundColor: '#FFFFFF',
        borderColor: '#D8EDE5',

      series: [{

        data: [root],
        orient: 'LR',
        left: '8%',
        right: '24%',
        top: 24,
        bottom: 24,
        symbol: 'roundRect',
        symbolSize: [146, 30],
