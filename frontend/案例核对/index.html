<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案例核对与证据溯源 · 数小伴</title>
<link rel="stylesheet" href="vendor/element-plus.css">
<style>
  :root{
    --bg:#F4FBF8;
    --primary:#62B89B;
    --primary-deep:#3E8F76;
    --primary-soft:#E8F6F1;
    --primary-line:#BFE5D8;
    --ink:#333333;
    --muted:#8A9A95;
    --line:#EAF2EF;
    --radius:16px;
    --shadow:0 4px 12px rgba(0,0,0,.03);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI","Segoe UI Emoji",sans-serif;
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ---------- 顶部导航 ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:linear-gradient(90deg,#E6F8F1 0%,#F6FDFA 52%,#E4F7EF 100%);
    border-bottom:1px solid #C6EADF;
    box-shadow:0 2px 14px rgba(63,174,147,.09);
    backdrop-filter:blur(10px);
  }

  .topbar-inner{
    max-width:1440px;
    margin:0 auto;
    height:62px;
    padding:0 32px;
    display:flex;
    align-items:center;
    gap:34px;
  }

  .brand{flex:0 0 auto;display:flex;align-items:center;gap:10px;}

  .brand-logo{
    width:38px;
    height:38px;
    overflow:hidden;
    border-radius:11px;
    border:1px solid #BFE9DA;
    background:linear-gradient(135deg,#FFFFFF,#D8F5EA);
    display:grid;
    place-items:center;
    box-shadow:0 2px 8px rgba(63,174,147,.14);
  }

  .brand-logo img{display:block;width:100%;height:100%;object-fit:cover;}
  .brand-name{font-size:15px;font-weight:700;letter-spacing:.5px;}

  .mainnav{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    min-width:0;
  }

  .nav-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 12px;
    border-radius:9px;
    font-size:13px;
    color:#708480;
    white-space:nowrap;
    transition:background .18s,color .18s;
  }

  .nav-link .ico{font-size:13px;opacity:.9;}
  .nav-link:hover{background:rgba(111,211,183,.18);color:var(--primary-deep);}

  .nav-link.is-active{
    color:#175F4C;
    font-weight:700;
    background:linear-gradient(135deg,#D5F3E8,#ECFAF4);
    box-shadow:inset 0 -2px 0 #3FAE93;
  }

  /* ---------- 布局 ---------- */
  .layout{
    max-width:1440px;
    margin:0 auto;
    padding:0 32px 44px;
    display:flex;
    align-items:flex-start;
  }

  .sidebar{
    flex:0 0 208px;
    width:208px;
    border-right:1px solid var(--line);
    padding:22px 24px 10px 0;
    position:sticky;
    top:78px;
    max-height:calc(100vh - 96px);
    overflow-y:auto;
    align-self:flex-start;
  }

  .side-brand{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 0 14px;
    border-bottom:1px solid var(--line);
    margin-bottom:12px;
  }

  .side-brand img{
    width:26px;
    height:26px;
    border-radius:8px;
    object-fit:cover;
    border:1px solid var(--primary-line);
  }

  .side-brand span{font-size:13px;font-weight:700;letter-spacing:.3px;}

  .side-menu{display:flex;flex-direction:column;gap:2px;}

  .side-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px 9px;
    border-radius:8px;
    font-size:12.5px;
    color:#4E6862;
    border:0;
    background:none;
    text-align:left;
    cursor:pointer;
    transition:background .18s,color .18s;
  }

  .side-item .ico{font-size:12.5px;}
  .side-item:hover{background:#F2FAF7;color:var(--primary-deep);}

  .side-item.is-active{
    background:var(--primary-soft);
    color:#1F6B55;
    font-weight:700;
    box-shadow:inset 2px 0 0 var(--primary);
  }

  .side-tools{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .field{margin:0;}

  .field-label{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:11.5px;
    color:var(--muted);
  }

  .field-label .ico{font-size:12px;opacity:.95;}

  .side-select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background-color:#fff;
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 28px 8px 11px;
    font-size:12.5px;
    color:var(--ink);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1.5L5 5.5L9 1.5' fill='none' stroke='%23708480' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:10px 7px;
    transition:border-color .18s,box-shadow .18s,background-color .18s;
  }

  .side-select:hover{
    border-color:var(--primary);
    background-color:var(--primary);
    box-shadow:0 0 0 3px rgba(63,174,147,.22);
  }

  .side-select:focus{outline:none;border-color:var(--primary);}

  .tool-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    width:100%;
    padding:9px 10px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    color:#3E5651;
    font-size:12.5px;
    cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,box-shadow .18s;
  }

  .tool-btn:hover{
    background:var(--primary);
    border-color:var(--primary);
    color:#1D4B40;
    box-shadow:0 4px 12px rgba(63,174,147,.28);
  }

  .tool-btn--primary{
    border:0;
    background:linear-gradient(135deg,#7FCFB6,#4FA98E);
    color:#fff;
    font-weight:700;
    box-shadow:0 6px 14px rgba(79,169,142,.26);
  }

  .tool-btn--primary:hover{
    background:linear-gradient(135deg,#72C7AC,#469E84);
    color:#fff;
    box-shadow:0 8px 18px rgba(79,169,142,.34);
  }

  .spin{display:inline-block;animation:spin .8s linear infinite;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* ---------- 主内容 ---------- */
  .main{flex:1;min-width:0;padding:20px 0 0 32px;}

  .page-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:8px;
  }

  .page-title{margin:0;font-size:22px;font-weight:800;letter-spacing:.4px;}
  .page-sub{margin:5px 0 0;font-size:12.5px;color:var(--muted);}

  .head-meta{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 12px;
    border-radius:999px;
    background:#fff;
    border:1px solid var(--line);
    font-size:11.5px;
    color:#6C837C;
  }

  .meta-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);}

  .case-tabs .el-tabs__header{margin-bottom:14px;}

  .case-tabs .el-tabs__item{
    font-size:12.5px;
    color:#7C918B;
    height:38px;
    padding:0 16px;
  }

  .case-tabs .el-tabs__item.is-active{color:#2F7A63;font-weight:700;}

  .case-tabs .el-tabs__active-bar{background:var(--primary);height:3px;border-radius:2px;}

  .case-tabs .el-tabs__nav-wrap::after{height:1px;background:var(--line);}

  /* ---------- 学生信息卡 ---------- */
  .student-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 20px;
    margin-bottom:14px;
  }

  .stu-main{display:flex;align-items:center;gap:12px;}

  .stu-avatar{
    width:42px;
    height:42px;
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:15px;
    font-weight:800;
    color:#2F7A63;
    background:linear-gradient(135deg,#E6F8F1,#CDEFE2);
    border:1px solid var(--primary-line);
  }

  .stu-name{font-size:14.5px;font-weight:700;}

  .stu-class{
    margin-left:6px;
    padding:1px 7px;
    border-radius:6px;
    background:#F2FAF7;
    color:#5C8B7C;
    font-size:10.5px;
    font-weight:600;
  }

  .stu-topic{margin-top:2px;font-size:11.5px;color:var(--muted);}

  .stu-stats{display:flex;align-items:center;gap:22px;}

  .stat{display:flex;flex-direction:column;align-items:flex-start;}

  .stat-num{font-size:17px;font-weight:800;color:#2F6F5B;line-height:1.3;}
  .stat-label{font-size:10.5px;color:var(--muted);}

  .student-card .el-tag{
    --el-tag-border-color:transparent;
    font-size:11.5px;
    font-weight:700;
    padding:0 12px;
    height:24px;
  }

  .el-tag--success{background:#E4F7EF;color:#2C7A61;}
  .el-tag--warning{background:#FFF4E3;color:#A87A2E;}
  .el-tag--danger{background:#FCEAEA;color:#A85A5A;}
  .el-tag--info{background:#EEF4F2;color:#5E7A72;}

  /* ---------- 三栏对照 ---------- */
  .flow{
    display:grid;
    grid-template-columns:1fr 38px 1fr 38px 1fr;
    gap:8px;
    align-items:stretch;
  }

  .flow-col{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px 18px;
    display:flex;
    flex-direction:column;
    min-height:318px;
    border:1px solid transparent;
    transition:border-color .2s,box-shadow .2s;
  }

  .flow-col:hover{border-color:#DFF2EA;box-shadow:0 6px 18px rgba(60,120,105,.06);}

  .flow-col--advice{background:linear-gradient(180deg,#FFFFFF,#FBFEFC);}

  .col-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding-bottom:10px;
    margin-bottom:12px;
    border-bottom:1px dashed #E6F0EC;
    font-size:13px;
    font-weight:800;
    color:#33534B;
  }

  .col-no{
    width:22px;
    height:22px;
    border-radius:7px;
    display:grid;
    place-items:center;
    font-size:10.5px;
    font-weight:800;
    color:#2F7A63;
    background:var(--primary-soft);
  }

  .flow-arrow{
    display:grid;
    place-items:center;
    color:#C2D6D0;
    font-size:17px;
    user-select:none;
  }

  .col-body{flex:1;display:flex;flex-direction:column;gap:10px;}

  .req-topic{
    margin:0;
    font-size:12px;
    font-weight:700;
    color:#2F6F5B;
  }

  .req-standard{
    margin:0;
    font-size:12px;
    line-height:1.9;
    color:#4A5F5A;
    padding:10px 12px;
    border-radius:10px;
    background:#F7FCFA;
    border-left:3px solid var(--primary);
  }

  .req-tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;}

  .soft-tag{
    display:inline-block;
    padding:3px 9px;
    border-radius:7px;
    background:var(--primary-soft);
    color:#3B7E68;
    font-size:10.5px;
    font-weight:700;
  }

  .soft-tag--plain{
    background:#F4F8F6;
    color:#7A908A;
    font-weight:600;
  }

  .perf-row{display:flex;gap:10px;}

  .perf-item{
    flex:1;
    padding:9px 10px;
    border-radius:10px;
    background:#F6FCF9;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .perf-item b{font-size:16px;font-weight:800;color:#2F7A63;line-height:1.2;}
  .perf-item span{font-size:10.5px;color:#8CA39B;}

  .warn-box{
    padding:9px 11px;
    border-radius:10px;
    background:#FFF6E8;
    border:1px dashed #F0D6A8;
    color:#9A6F25;
    font-size:11px;
    line-height:1.7;
  }

  .record-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .record{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    padding:7px 10px;
    border-radius:9px;
    background:#FAFCFB;
    border:1px solid #EFF5F2;
    font-size:11px;
    color:#4C625D;
    line-height:1.6;
  }

  .record--new{
    background:#E9F9F2;
    border-color:#A6DECB;
    box-shadow:0 3px 10px rgba(79,169,142,.14);
    animation:pop .5s ease both;
  }

  @keyframes pop{
    from{opacity:0;transform:translateY(-4px);}
    to{opacity:1;transform:translateY(0);}
  }

  .record-res{flex:0 0 auto;font-weight:700;font-size:10.5px;}
  .record-res.is-ok{color:#2C8A6D;}
  .record-res.is-miss{color:#B07A2E;}

  .col-foot{margin:auto 0 0;font-size:10.5px;color:#9AAFAA;}

  .advice-title{
    margin:0;
    font-size:12.5px;
    font-weight:800;
    color:#2F6F5B;
    padding:8px 10px;
    border-radius:10px;
    background:var(--primary-soft);
  }

  .advice-block{
    padding:9px 11px;
    border-radius:10px;
    background:#FAFCFB;
    border:1px solid #EFF5F2;
  }

  .advice-label{
    display:block;
    margin-bottom:2px;
    font-size:10.5px;
    font-weight:700;
    color:#8CA39B;
  }

  .advice-block p{margin:0;font-size:11.5px;line-height:1.8;color:#485D58;}

  .advice-note{
    margin-top:auto;
    padding-top:8px;
    border-top:1px dashed #E6F0EC;
    font-size:10px;
    color:#9AAFAA;
  }

  .fade-enter-active,.fade-leave-active{transition:opacity .25s ease,transform .25s ease;}
  .fade-enter-from{opacity:0;transform:translateY(4px);}
  .fade-leave-to{opacity:0;transform:translateY(-4px);}

  .el-loading-mask{border-radius:var(--radius);background:rgba(255,255,255,.82);}
  .el-loading-spinner .el-loading-text{font-size:12px;color:#3E8F76;}

  /* ---------- 多学生对比 ---------- */
  .section-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 12px;
    font-size:14px;
    font-weight:800;
    color:#33534B;
  }

  .section-title::before{
    content:"";
    width:3px;
    height:14px;
    border-radius:2px;
    background:var(--primary);
  }

  .compare-grid{display:flex;gap:14px;align-items:stretch;}

  .stu-card{
    flex:1 1 0;
    min-width:0;
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .stu-card-head{display:flex;align-items:center;gap:10px;}

  .stu-avatar--sm{width:34px;height:34px;border-radius:10px;font-size:12.5px;}

  .stu-card-head .el-tag{margin-left:auto;}

  .stu-sub{font-size:10.5px;color:var(--muted);}

  .stu-summary{
    font-size:11.5px;
    color:#5A716B;
    padding:8px 10px;
    border-radius:9px;
    background:#F7FCFA;
    border:1px dashed #E2F1EA;
  }

  .advice-soft{
    padding:10px 12px;
    border-radius:11px;
    font-size:11.5px;
    line-height:1.85;
    color:#445A55;
    flex:1;
  }

  .advice-soft--teal{background:#EAF8F3;border:1px solid #CFEDE2;}
  .advice-soft--amber{background:#FFF6E8;border:1px solid #F3DFBD;}
  .advice-soft--rose{background:#FDF0F0;border:1px solid #F2D6D6;}

  .advice-soft-label{
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
    color:#8CA39B;
    margin-bottom:4px;
  }

  .hl{
    background:rgba(98,184,155,.22);
    border-radius:4px;
    padding:0 2px;
    font-weight:700;
    color:#2C6B57;
  }

  .advice-soft--amber .hl{background:rgba(233,183,104,.32);color:#8A631F;}
  .advice-soft--rose .hl{background:rgba(224,140,140,.26);color:#8E4B4B;}

  .stu-foot{font-size:10.5px;color:#9AAFAA;}

  /* ---------- 导出 ---------- */
  .export-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}

  .text-card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
  }

  .text-card + .text-card{margin-top:14px;}

  .text-card h3{
    margin:0 0 8px;
    font-size:12.5px;
    font-weight:800;
    color:#33534B;
  }

  .text-card p{margin:0 0 6px;font-size:11.5px;line-height:1.85;color:#5C726C;}
  .text-card p:last-child{margin-bottom:0;}

  .text-card ul{
    margin:0;
    padding-left:16px;
    font-size:11.5px;
    line-height:1.9;
    color:#5C726C;
  }

  .doc-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 16px;}

  .doc-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 11px;
    border-radius:10px;
    background:#FAFCFB;
    border:1px solid #EFF5F2;
    font-size:11.5px;
    transition:all .18s;
  }

  .doc-item:hover{border-color:#CFEDE2;background:#F5FCF9;}

  .doc-code{
    flex:0 0 34px;
    height:22px;
    border-radius:6px;
    display:grid;
    place-items:center;
    font-size:10px;
    font-weight:800;
    color:#2F7A63;
    background:var(--primary-soft);
  }

  .doc-name{flex:1;color:#465C57;}
  .doc-meta{font-size:10.5px;color:#9AAFAA;}

  .download-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px 18px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#72C7AC,#4A9F86);
    color:#fff;
    font-size:14.5px;
    font-weight:800;
    letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(74,159,134,.28);
    transition:transform .18s,box-shadow .18s,background .18s;
  }

  .download-btn:hover{
    transform:translateY(-1px);
    background:linear-gradient(135deg,#66BE9F,#42967D);
    box-shadow:0 14px 26px rgba(74,159,134,.34);
  }

  .download-btn .dl-ico{font-size:18px;}

  .download-note{
    margin:9px 0 0;
    text-align:center;
    font-size:10.5px;
    color:#9AAFAA;
  }

  @media (max-width:1200px){
    .mainnav{overflow-x:auto;scrollbar-width:none;}
    .mainnav::-webkit-scrollbar{display:none;}
    .nav-link{padding:8px 9px;font-size:12.5px;}
    .topbar-inner{gap:18px;}
    .export-grid{grid-template-columns:1fr;}
  }

  @media (max-width:1080px){
    .topbar-inner{padding:0 20px;gap:16px;}
    .main{padding:18px 0 0 24px;}
    .flow{grid-template-columns:1fr;}
    .flow-arrow{transform:rotate(90deg);height:18px;}
    .compare-grid{flex-direction:column;}
    .student-card{align-items:flex-start;}
  }

  @media (max-width:960px){
    .layout{flex-direction:column;padding:0 20px 32px;gap:18px;}
    .sidebar{
      position:static;
      flex:0 0 auto;
      width:100%;
      max-height:none;
      padding:16px 0 8px;
      border-right:0;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px 16px;
      align-items:start;
    }
    .side-brand,.side-menu,.side-tools{grid-column:1/-1;}
    .main{padding:4px 0 0;}
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../首页/index.html">
        <span class="brand-logo"><img src="../创图/logo.jpg" alt="数小伴 Logo"></span>
        <span class="brand-name">数小伴</span>
      </a>
      <nav class="mainnav" aria-label="主导航">
        <a class="nav-link" href="../首页/index.html"><span class="ico">🏠</span>首页</a>
        <a class="nav-link" href="../学习梳理/index.html"><span class="ico">📚</span>学习梳理</a>
        <a class="nav-link" href="#"><span class="ico">📈</span>学情分析</a>
        <a class="nav-link" href="#"><span class="ico">💡</span>学习建议</a>
        <a class="nav-link is-active" href="#"><span class="ico">🧾</span>案例核对</a>
        <a class="nav-link" href="#"><span class="ico">⚙️</span>设置</a>
      </nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-brand">
        <img src="../创图/logo.jpg" alt="">
        <span>数小伴</span>
      </div>

      <nav class="side-menu">
        <button
          v-for="item in menus"
          :key="item.key"
          class="side-item"
          :class="{ 'is-active': item.key === 'check' }"
          type="button"
          @click="goMenu(item)">
          <span class="ico">{{ item.icon }}</span>{{ item.label }}
        </button>
      </nav>

      <div class="side-tools">
        <div class="field">
          <div class="field-label"><span class="ico">🏫</span>班级编号</div>
          <select class="side-select" v-model="classCode" @change="onClassChange">
            <option value="DC01">DC01</option>
            <option value="DC02">DC02</option>
          </select>
        </div>

        <div class="field">
          <div class="field-label"><span class="ico">👦</span>学生ID</div>
          <select class="side-select" v-model="studentId" @change="onStudentChange">
            <option v-for="s in studentOptions" :key="s" :value="s">{{ s }}</option>
          </select>
        </div>

        <div class="field">
          <div class="field-label"><span class="ico">📚</span>主题筛选</div>
          <select class="side-select" v-model="topic" @change="onTopicChange">
            <option value="all">全部主题</option>
            <option v-for="t in topicOptions" :key="t" :value="t">{{ t }}</option>
          </select>
        </div>

        <button class="tool-btn" type="button" @click="reloadData">
          <span :class="{ spin: reloading }">↻</span> 重载数据
        </button>
        <button class="tool-btn tool-btn--primary" type="button" @click="simulateAdd">
          ＋ 模拟新增记录
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1 class="page-title">案例核对与证据溯源</h1>
          <p class="page-sub">逐条核对证据链，确认结论可追溯、可复现</p>
        </div>
        <div class="head-meta">
          <i class="meta-dot"></i>当前主题：{{ topicLabel }}
        </div>
      </div>

      <el-tabs v-model="activeTab" class="case-tabs">
        <el-tab-pane name="A">
          <template #label>案例A · 记录充足学生</template>
          <case-panel :data="caseA" :computing="computing"></case-panel>
        </el-tab-pane>
        <el-tab-pane name="B">
          <template #label>案例B · 信息不足学生</template>
          <case-panel :data="caseB" :computing="computing"></case-panel>
        </el-tab-pane>
        <el-tab-pane name="C" label="多学生对比">
          <compare-panel></compare-panel>
        </el-tab-pane>
        <el-tab-pane name="D" label="系统设置 &amp; 导出">
          <export-panel></export-panel>
        </el-tab-pane>
      </el-tabs>
    </main>
  </div>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/element-plus.js"></script>
<script>
(function(){
  var ref = Vue.ref;
  var reactive = Vue.reactive;
  var computed = Vue.computed;

  var app = Vue.createApp({
    setup: function(){
      var activeTab = ref('A');
      var computing = ref(false);
      var reloading = ref(false);
      var topic = ref('一元一次方程');
      var studentId = ref('D07');

      var menus = [
        { key: 'content', label: '学习梳理', icon: '📚', href: '../学习梳理/index.html' },
        { key: 'analysis', label: '学情分析', icon: '📈' },
        { key: 'advice', label: '学习建议', icon: '💡' },
        { key: 'check', label: '案例核对', icon: '🧾' }
      ];

      var topicOptions = ['一元一次方程', '代数式与整式运算', '不等式与不等式组'];

      var classCode = ref('DC01');

      function buildStudents(code){
        var list = [];
        var start = code === 'DC02' ? 21 : 1;
        var end = code === 'DC02' ? 40 : 20;
        for(var i = start; i <= end; i++){
          list.push('D' + (i < 10 ? '0' + i : i));
        }
        return list;
      }

      var studentOptions = computed(function(){
        return buildStudents(classCode.value);
      });

      var caseA = reactive({
        id: 'D07',
        classCode: 'DC01',
        topic: '一元一次方程',
        answered: 12,
        accuracy: '83.3%',
        status: '记录充足',
        statusType: 'success',
        requirement: {
          standard: '能理解方程的意义，掌握等式的基本性质，能解一元一次方程，并能依据等量关系建立模型解决问题。',
          material: 'M-018',
          source: '课标 P63 / 正文 P56 · 上册 P110—148'
        },
        summary: { total: 6, right: 5, rate: '83%' },
        warning: '',
        records: [
          { q: 'M-011 · 判断下列式子是否为一元一次方程', result: '正确', ok: true },
          { q: 'M-013 · 由 3x − 7 = 8 推出 3x = 15 的依据', result: '正确', ok: true },
          { q: 'M-018 · 解方程 2(x − 3) = 3x + 4', result: '正确', ok: true },
          { q: 'M-021 · 去括号解方程 3(x + 1) = 2x + 9', result: '错误', ok: false }
        ],
        added: 0,
        advice: {
          title: '当前判断：已掌握等式性质与移项法则',
          reason: '本知识点 6 道题中正确 5 道（83%），证据覆盖完整，推理链路（学习要求 → 表现证据 → 学习建议）可闭环。',
          next: '进入「去分母」变式训练，2 组共 6 题；重点观察符号处理。'
        },
        adviceAfter: {
          title: '补充证据后：结论不变，置信度提升',
          reason: '新增 1 条正确记录后正确率升至 85.7%，覆盖 7/8 题，可稳定判定为已掌握。',
          next: '跳过基础巩固，直接进入实际应用建模（3 题）。'
        },
        newRecord: { q: 'M-042 · 用等式性质解方程 x/2 − 1 = 3', result: '正确', ok: true }
      });

      var caseB = reactive({
        id: 'D19',
        classCode: 'DC01',
        topic: '一元一次方程',
        answered: 2,
        accuracy: '50.0%',
        status: '信息不足',
        statusType: 'warning',
        requirement: {
          standard: '能理解方程的意义，掌握等式的基本性质，能解一元一次方程，并能依据等量关系建立模型解决问题。',
          material: 'M-020',
          source: '课标 P63 / 正文 P56 · 上册 P110—148'
        },
        summary: { total: 5, right: 1, rate: '20%' },
        warning: '覆盖度仅 20%，证据不足以判定掌握，按推理准则暂不判定学生未掌握。',
        records: [
          { q: 'M-020 · 解方程 5x − 4 = 3x + 6', result: '正确', ok: true },
          { q: 'M-021 · 去括号解方程 2(x − 1) = 5', result: '未作答', ok: false }
        ],
        added: 0,
        advice: {
          title: '暂不判定未掌握，建议先补充证据',
          reason: '仅 1 道题形成有效证据，无法覆盖「等式性质 → 移项」的完整链路，证据不足时不作负面判定。',
          next: '优先补做 M-022、M-024 两道核心题，覆盖等式性质与移项。'
        },
        adviceAfter: {
          title: '证据更新：覆盖度 33%，仍不足以判定',
          reason: '新增 1 条正确记录后有效证据增至 2 条，链路仍缺「合并同类项」环节。',
          next: '再补做 M-026 一题即可达到判定阈值（覆盖度 ≥ 50%）。'
        },
        newRecord: { q: 'M-022 · 用等式性质解方程 4x + 5 = 17', result: '正确', ok: true }
      });

      var topicLabel = computed(function(){
        return topic.value === 'all' ? '全部主题' : topic.value;
      });

      function simulateAdd(){
        if(computing.value) return;
        if(activeTab.value !== 'A' && activeTab.value !== 'B'){
          activeTab.value = 'A';
        }
        var target = activeTab.value === 'B' ? caseB : caseA;
        computing.value = true;

        window.setTimeout(function(){
          target.records.push({
            q: target.newRecord.q,
            result: target.newRecord.result,
            ok: target.newRecord.ok,
            isNew: true
          });
          target.added += 1;
          target.answered += 1;
          target.summary.right += 1;
          target.summary.rate = Math.round(target.summary.right / target.summary.total * 100) + '%';
          target.accuracy = (target.accuracy === '83.3%' ? '85.7%' : '66.7%');
          if(target === caseB && target.added === 1){
            target.warning = '覆盖度提升至 33%，仍不足以判定掌握，需继续补充核心题证据。';
          }
          computing.value = false;
          ElementPlus.ElMessage.success('已新增 1 条答题记录，并重新计算分析');
        }, 1000);
      }

      function reloadData(){
        if(reloading.value) return;
        reloading.value = true;
        window.setTimeout(function(){
          reloading.value = false;
          ElementPlus.ElMessage.success('数据已重载（' + topicLabel.value + '）');
        }, 800);
      }

      function onTopicChange(){
        ElementPlus.ElMessage({
          message: '已切换主题：' + topicLabel.value,
          type: 'success'
        });
      }

      function onStudentChange(){
        ElementPlus.ElMessage({
          message: '已定位学生：' + studentId.value + '（' + classCode.value + '）',
          type: 'success'
        });
      }

      function onClassChange(){
        studentId.value = classCode.value === 'DC02' ? 'D21' : 'D01';
        ElementPlus.ElMessage({
          message: '已切换班级：' + classCode.value,
          type: 'success'
        });
      }

      function goMenu(item){
        if(item.href){
          window.location.href = item.href;
          return;
        }
        if(item.key === 'check') return;
        ElementPlus.ElMessage({ message: '「' + item.label + '」页面建设中，敬请期待', type: 'info' });
      }

      return {
        menus: menus,
        activeTab: activeTab,
        computing: computing,
        reloading: reloading,
        topic: topic,
        topicLabel: topicLabel,
        topicOptions: topicOptions,
        studentId: studentId,
        studentOptions: studentOptions,
        classCode: classCode,
        caseA: caseA,
        caseB: caseB,
        simulateAdd: simulateAdd,
        reloadData: reloadData,
        onTopicChange: onTopicChange,
        onStudentChange: onStudentChange,
        onClassChange: onClassChange,
        goMenu: goMenu
      };
    }
  });

  /* ---------- 复用：案例三栏对照 ---------- */
  app.component('case-panel', {
    props: {
      data: { type: Object, required: true },
      computing: { type: Boolean, default: false }
    },
    computed: {
      currentAdvice: function(){
        return this.data.added > 0 ? this.data.adviceAfter : this.data.advice;
      }
    },
    template: `
      <div class="case-wrap">
        <div class="student-card">
          <div class="stu-main">
            <div class="stu-avatar">{{ data.id }}</div>
            <div>
              <div class="stu-name">学生 {{ data.id }}
                <span class="stu-class">{{ data.classCode }}</span>
              </div>
              <div class="stu-topic">当前知识点：{{ data.topic }}</div>
            </div>
          </div>
          <div class="stu-stats">
            <div class="stat"><span class="stat-num">{{ data.answered }}</span><span class="stat-label">已答题目数</span></div>
            <div class="stat"><span class="stat-num">{{ data.accuracy }}</span><span class="stat-label">整体正确率</span></div>
            <el-tag :type="data.statusType" round effect="light">{{ data.status }}</el-tag>
          </div>
        </div>

        <div class="flow" v-loading="computing" element-loading-text="正在重新计算分析...">
          <div class="flow-col">
            <div class="col-head"><span class="col-no">01</span>学习要求</div>
            <div class="col-body">
              <p class="req-topic">{{ data.topic }}</p>
              <p class="req-standard">{{ data.requirement.standard }}</p>
              <div class="req-tags">
                <span class="soft-tag">材料 {{ data.requirement.material }}</span>
                <span class="soft-tag soft-tag--plain">{{ data.requirement.source }}</span>
              </div>
            </div>
          </div>

          <div class="flow-arrow">→</div>

          <div class="flow-col">
            <div class="col-head"><span class="col-no">02</span>已有表现</div>
            <div class="col-body">
              <div class="perf-row">
                <div class="perf-item"><b>{{ data.summary.rate }}</b><span>本知识点正确率</span></div>
                <div class="perf-item"><b>{{ data.summary.right }}/{{ data.summary.total }}</b><span>正确 / 应覆盖</span></div>
              </div>
              <div v-if="data.warning" class="warn-box">⚠️ {{ data.warning }}</div>
              <ul class="record-list">
                <li v-for="(r, i) in data.records" :key="i" class="record" :class="{ 'record--new': r.isNew }">
                  <span class="record-q">{{ r.q }}</span>
                  <span class="record-res" :class="r.ok ? 'is-ok' : 'is-miss'">{{ r.result }}</span>
                </li>
              </ul>
              <p class="col-foot">共 {{ data.records.length }} 条可溯源记录 · 材料库 60 题</p>
            </div>
          </div>

          <div class="flow-arrow">→</div>

          <div class="flow-col flow-col--advice">
            <div class="col-head"><span class="col-no">03</span>学习建议</div>
            <div class="col-body">
              <transition name="fade" mode="out-in">
                <div :key="data.added" style="display:flex;flex-direction:column;gap:9px;flex:1;">
                  <p class="advice-title">{{ currentAdvice.title }}</p>
                  <div class="advice-block">
                    <span class="advice-label">理由</span>
                    <p>{{ currentAdvice.reason }}</p>
                  </div>
                  <div class="advice-block">
                    <span class="advice-label">下一步练习</span>
                    <p>{{ currentAdvice.next }}</p>
                  </div>
                  <div class="advice-note">推理准则：证据不足时，不判定学生未掌握</div>
                </div>
              </transition>
            </div>
          </div>
        </div>
      </div>
    `
  });

  /* ---------- 多学生对比 ---------- */
  app.component('compare-panel', {
    setup: function(){
      var students = [
        {
          id: 'D03',
          classCode: 'DC01 · 记录充足',
          tag: '记录充足',
          type: 'success',
          summary: '已答 12 题 · 正确率 83% · 证据覆盖 6/6',
          tone: 'teal',
          footer: '结论：已掌握等式性质，可进入综合应用',
          parts: [
            { t: '建议进入' },
            { t: '情境建模层', hl: true },
            { t: '，完成 3 道列方程解应用题，重点训练' },
            { t: '等量关系提取', hl: true },
            { t: '。' }
          ]
        },
        {
          id: 'D11',
          classCode: 'DC01 · 信息不足',
          tag: '信息不足',
          type: 'warning',
          summary: '已答 2 题 · 覆盖度 20% · 有效证据 1 条',
          tone: 'amber',
          footer: '结论：暂不判定未掌握，需补充证据',
          parts: [
            { t: '暂不判定掌握，优先补做' },
            { t: '2 道等式性质核心题', hl: true },
            { t: '（M-022、M-024），补足' },
            { t: '移项环节', hl: true },
            { t: '的证据链后再判定。' }
          ]
        },
        {
          id: 'D24',
          classCode: 'DC02 · 表现异常',
          tag: '表现异常',
          type: 'danger',
          summary: '已答 9 题 · 正确率 44% · 3 条答案前后矛盾',
          tone: 'rose',
          footer: '结论：需人工复核记录可信度',
          parts: [
            { t: '先' },
            { t: '复核 M-031 的作答过程', hl: true },
            { t: '，确认是否存在' },
            { t: '抄写错误', hl: true },
            { t: '，再决定是否重练该知识点。' }
          ]
        }
      ];
      return { students: students };
    },
    template: `
      <div>
        <h2 class="section-title">学情差异对比</h2>
        <div class="compare-grid">
          <div class="stu-card" v-for="s in students" :key="s.id">
            <div class="stu-card-head">
              <div class="stu-avatar stu-avatar--sm">{{ s.id }}</div>
              <div>
                <div class="stu-name">学生 {{ s.id }}</div>
                <div class="stu-sub">{{ s.classCode }}</div>
              </div>
              <el-tag :type="s.type" round effect="light">{{ s.tag }}</el-tag>
            </div>
            <div class="stu-summary">{{ s.summary }}</div>
            <div class="advice-soft" :class="'advice-soft--' + s.tone">
              <div class="advice-soft-label">个性化建议</div>
              <p><span v-for="(p, i) in s.parts" :key="i" :class="{ hl: p.hl }">{{ p.t }}</span></p>
            </div>
            <div class="stu-foot">{{ s.footer }}</div>
          </div>
        </div>
      </div>
    `
  });

  /* ---------- 系统设置与导出 ---------- */
  app.component('export-panel', {
    setup: function(){
      var docs = [
        { code: 'M1', name: '学习要求清单', meta: '9 条 · 7 字段' },
        { code: 'M2', name: '学情证据汇总表', meta: '40 人 · 806 条' },
        { code: 'M3', name: '个性化学习建议', meta: '40 份 · 3 维度' },
        { code: 'M4', name: '案例核对与溯源报告', meta: '3 个案例' },
        { code: 'M5', name: '班级对比分析', meta: 'DC01 / DC02' },
        { code: 'M6', name: '数据字典', meta: '18 个字段' },
        { code: 'M7', name: '成果说明文档', meta: '1 份' }
      ];

      function downloadBundle(){
        var bundle = {
          package: '数小伴成果包 M1-M7',
          exportedAt: new Date().toISOString(),
          docs: docs
        };
        var blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = '数小伴_成果包_M1-M7.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        ElementPlus.ElMessage.success('成果包已开始下载');
      }

      return { docs: docs, downloadBundle: downloadBundle };
    },
    template: `
      <div class="export-grid">
        <div>
          <div class="text-card">
            <h3>数据源说明</h3>
            <p>学习资料（5_课程标准及相关教学资源）：包含 2022 年版义务教育数学课程标准及人教版七年级相关教材切片。</p>
            <p>练习题共 60 道，其中 18 道解答题附作答过程与分点评分；学情数据来源为 2 次模拟的 DC01 / DC02 两班 40 名学生答题记录。</p>
          </div>
          <div class="text-card">
            <h3>系统局限与适用范围</h3>
            <ul>
              <li>适用于七年级数学「数与代数」现有指标范围，暂不覆盖图形与几何的完整推理链。</li>
              <li>证据覆盖度低于 50% 时，系统仅输出待补充证据提示，不输出掌握 / 未掌握结论。</li>
              <li>分点评分依赖人工标注质量，异常记录需人工复核后再纳入分析。</li>
              <li>当前为演示数据，正式使用需接入学校真实答题数据源。</li>
            </ul>
          </div>
        </div>

        <div class="text-card">
          <h3>成果包字段说明</h3>
          <div class="doc-list">
            <div class="doc-item" v-for="d in docs" :key="d.code">
              <span class="doc-code">{{ d.code }}</span>
              <span class="doc-name">{{ d.name }}</span>
              <span class="doc-meta">{{ d.meta }}</span>
            </div>
          </div>
          <button class="download-btn" type="button" @click="downloadBundle">
            <span class="dl-ico">⤓</span>一键下载完整成果包（M1-M7）
          </button>
          <p class="download-note">共 7 份交付物，导出为 JSON；包含学习要求清单、证据汇总、建议与核对报告。</p>
        </div>
      </div>
    `
  });

  app.use(ElementPlus).mount('#app');
})();
</script>
</body>
</html>
